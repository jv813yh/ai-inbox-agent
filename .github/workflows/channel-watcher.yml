name: Channel Watcher

'on':
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install youtube-transcript-api yt-dlp pyyaml

      - name: Download channel state
        uses: actions/download-artifact@v4
        with:
          name: channel-state
          path: src/
        continue-on-error: true

      - name: Run Channel Watcher Bot
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY_GITHUB_EMAIL }}
          CLAUDE_API_KEY_GITHUB_EMAIL: ${{ secrets.CLAUDE_API_KEY_GITHUB_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          TZ: Europe/Bratislava
        working-directory: src
        run: python channel_watcher_bot.py

      - name: Upload channel state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-state
          path: src/channel_state.json
          retention-days: 90
          overwrite: true
