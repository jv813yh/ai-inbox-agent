name: Email AI Summary

on:
  schedule:
    - cron: '0 20 * * *'  # 20:00 (8 PM) každý deň
  workflow_dispatch:      # Manuálne spustenie

jobs:
  email-summary:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install youtube-transcript-api yt-dlp python-telegram-bot google-auth-httplib2 google-api-python-client pyyaml
      
      - name: Run Email Summary Bot
        env:
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY_GITHUB_EMAIL }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        working-directory: src
        run: python email_summary_bot_apppassword.py
        
      - name: Save data to repo
        if: always()
        run: |
          mkdir -p data
          if [ -f prepared_content.json ]; then
            cp prepared_content.json data/prepared_content_$(date +%Y%m%d_%H%M%S).json
            cp prepared_content.json data/latest.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "📧 Auto-save email data $(date +%Y-%m-%d)" || echo "No changes"
            git push